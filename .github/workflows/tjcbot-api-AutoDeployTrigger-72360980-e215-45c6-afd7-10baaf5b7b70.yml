name: Trigger auto deployment for tjcbot-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/tjcbot-api:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TJCBOTAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TJCBOTAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TJCBOTAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: tjcbot-api
          resourceGroup: DefaultResourceGroup-EUS2
          imageToDeploy: ${{ env.IMAGE_NAME }}
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          disableTelemetry: true
